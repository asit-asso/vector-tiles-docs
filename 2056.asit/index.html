<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Fonds de plan ASIT Vector Tiles en EPSG:2056</title>

	<!-- OpenLayers -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.10.0/ol.css" />
	<script src="https://cdn.jsdelivr.net/npm/ol@10.10.0/dist/ol.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/ol-mapbox-style@12.4/dist/olms.js"></script>

	<!-- proj4 for EPSG:2056 -->
	<script src="https://cdn.jsdelivr.net/npm/proj4@2.11.0/dist/proj4.min.js"></script>

	<link rel="stylesheet" href="style.css" />
</head>

<body>
	<div id="map"></div>

	<!-- Basemap Switcher -->
	<div class="basemap-switcher" id="basemapSwitcher">
		<div class="basemap-option" data-style="https://vt.asit-asso.ch/styles/2056.asit/asit.cadastral/style.json"
			data-tiles-url="https://vt.asit-asso.ch/tiles/asit.cadastral.hires/v0.1/2056.asit/{z}/{x}/{y}.mvt">
			<img src="../thumbnail/cadastral.png" alt="Cadastral" />
			<span>Cadastral</span>
		</div>
		<div class="basemap-option" data-style="https://vt.asit-asso.ch/styles/2056.asit/asit.cadastryle/style.json"
			data-tiles-url="https://vt.asit-asso.ch/tiles/asit.cadastral.hires/v0.1/2056.asit/{z}/{x}/{y}.mvt">
			<img src="../thumbnail/cadastryle.png" alt="Cadastral" />
			<span>Cadastryle</span>
		</div>
	</div>

	<script src="map.js" type="module"></script>
</body>

</html>
